<!doctype html>

<html>
  <head>
    <meta charset="UTF-8" />
    <title>Worksheet 6 - Part 2</title>
  </head>

  <body>
    <canvas id="canvas" width="512" height="512"> </canvas>

    <br /><br />

    <label>
      Wrapping:
      <select id="wrapMode">
        <option value="repeat">repeat</option>
        <option value="clamp-to-edge">clamp-to-edge</option>
      </select>
    </label>

    <br />

    <label>
      Min filter:
      <select id="minFilter">
        <option value="nearest">nearest</option>
        <option value="linear">linear</option>
      </select>
    </label>

    <br />

    <label>
      Mag filter:
      <select id="magFilter">
        <option value="nearest">nearest</option>
        <option value="linear">linear</option>
      </select>
    </label>

    <br />

    <label>
      Mipmap filter:
      <select id="mipmapFilter">
        <option value="nearest">nearest</option>
        <option value="linear">linear</option>
      </select>
    </label>

    <br />

    <label>
      Enable mipmapping:
      <input id="mipmapping" type="checkbox" checked />
    </label>

    <script src="genmipmap.js"></script>
    <script src="main.js"></script>
  </body>
</html>
