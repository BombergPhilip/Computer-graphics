
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worksheet 5 - Part 1</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        canvas {
            display: block;
            max-width: 100%;
            margin: 12px 0;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>

    <script src="../../resources/MV.js"></script>

    <script id="sphere-wgsl" type="x-shader">
        struct Uniforms {
            mvp: mat4x4f,
            eye: vec4f,
            params1: vec4f,
            params2: vec4f,
        };

        @group(0) @binding(0)
        var<uniform> uniforms: Uniforms;

        struct VSOut {
            @builtin(position) position: vec4f,
            @location(0) worldPosition: vec3f,
            @location(1) normal: vec3f,
        };

        @vertex
        fn main_vs(
            @location(0) position: vec3f
        ) -> VSOut {
            var output: VSOut;

            output.position =
                uniforms.mvp * vec4f(position, 1.0);

            output.worldPosition = position;
            output.normal = normalize(position);

            return output;
        }

        @fragment
        fn main_fs(
            @location(0) worldPosition: vec3f,
            @location(1) normal: vec3f
        ) -> @location(0) vec4f {
            let n = normalize(normal);
            let l = vec3f(0.0, 0.0, 1.0);

            let v = normalize(
                uniforms.eye.xyz - worldPosition
            );

            let r = reflect(-l, n);

            let kd = uniforms.params1.x;
            let ks = uniforms.params1.y;
            let shininess = uniforms.params1.z;
            let Le = uniforms.params1.w;
            let La = uniforms.params2.x;

            let kdColor = vec3f(0.8, 0.3, 0.2);
            let ksColor = vec3f(1.0, 1.0, 1.0);

            let diffuse = max(dot(n, l), 0.0);

            let specular = pow(
                max(dot(r, v), 0.0),
                shininess
            );

            let ambientLight = kd * kdColor * La;

            let diffuseLight =
                kd * kdColor * Le * diffuse;

            let specularLight =
                ks * ksColor * Le * specular;

            let color =
                ambientLight +
                diffuseLight +
                specularLight;

            return vec4f(color, 1.0);
        }
    </script>

    <script src="myscript.js"></script>
</head>

<body>
    <h2>Worksheet 5 - Part 1</h2>

    <div>
        <button id="decrease">−</button>
        <button id="increase">+</button>
        <span>Subdivision level: <span id="level">3</span></span>
    </div>

    <canvas id="my-canvas" width="512" height="512">
        Please use a browser that supports HTML5 canvas.
    </canvas>

    <div class="controls">
        <label>
            kd
            <input id="kd" type="range"
                   min="0" max="1" step="0.01" value="0.8">
        </label>

        <label>
            ks
            <input id="ks" type="range"
                   min="0" max="1" step="0.01" value="0.5">
        </label>

        <label>
            Shininess
            <input id="shininess" type="range"
                   min="1" max="100" step="1" value="20">
        </label>

        <label>
            Le
            <input id="Le" type="range"
                   min="0" max="2" step="0.01" value="1">
        </label>

        <label>
            La
            <input id="La" type="range"
                   min="0" max="1" step="0.01" value="0.2">
        </label>
    </div>

    <p id="status" role="alert"></p>
</body>
</html>
