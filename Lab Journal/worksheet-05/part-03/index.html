    <script src="../../resources/MV.js"></script>
    <script src="../../resources/OBJParser.js"></script>

    <script id="shader-wgsl" type="x-shader">
        struct Uniforms {
            mvp: mat4x4f,
        };

        @group(0) @binding(0)
        var<uniform> uniforms: Uniforms;

        @vertex
        fn main_vs(
            @location(0) position: vec4f
        ) -> @builtin(position) vec4f {
            return uniforms.mvp * position;
        }

        @fragment
        fn main_fs() -> @location(0) vec4f {
            return vec4f(0.8, 0.3, 0.2, 1.0);
        }
    </script>

    <script src="myscript.js"></script>
