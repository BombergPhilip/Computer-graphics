    <script id="wgsl" type="x-shader">
      struct Uniforms {
        mvp: mat4x4f,
        visibility: f32,
      };

      @group(0) @binding(0) var<uniform> uniforms: Uniforms;
      @group(0) @binding(1) var mySampler: sampler;
      @group(0) @binding(2) var myTexture: texture_2d<f32>;

      struct VSOut {
        @builtin(position) position: vec4f,
        @location(0) texCoords: vec2f,
        @location(1) worldPos: vec3f,
      };

      @vertex
      fn main_vs(
        @location(0) inPos: vec3f,
        @location(1) inTexCoords: vec2f
      ) -> VSOut {
        var vsOut: VSOut;
        vsOut.position = uniforms.mvp * vec4f(inPos, 1.0);
        vsOut.texCoords = inTexCoords;
        vsOut.worldPos = inPos;
        return vsOut;
      }

      @fragment
      fn main_fs(
        @location(0) texCoords: vec2f,
        @location(1) worldPos: vec3f
      ) -> @location(0) vec4f {
        let marble = textureSample(myTexture, mySampler, texCoords);

        if (shadowSettings.showMap == 1u) {
          let depth = readShadowDepth(texCoords);
          return vec4f(vec3f(depth), 1.0);
        }

        let visibility = lightVisibility(worldPos);
        let ambient = 0.30 * marble.rgb;
        let direct = 0.70 * marble.rgb;

        return vec4f(ambient + visibility * direct, marble.a);
      }
    </script>
    <script id="teapot-wgsl" type="x-shader">
      struct Uniforms {
        model: mat4x4f,
        mvp: mat4x4f,
        light: vec4f,
      };

      @group(0) @binding(0) var<uniform> uniforms: Uniforms;

      struct VSOut {
        @builtin(position) position: vec4f,
        @location(0) worldPos: vec3f,
        @location(1) normal: vec3f,
      };

      @vertex
      fn teapot_vs(
        @location(0) inPos: vec4f,
        @location(1) inNormal: vec4f
      ) -> VSOut {
        var vsOut: VSOut;
        vsOut.position = uniforms.mvp * inPos;
        vsOut.worldPos = (uniforms.model * inPos).xyz;
        vsOut.normal = inNormal.xyz;
        return vsOut;
      }

      @fragment
      fn teapot_fs(
        @location(0) worldPos: vec3f,
        @location(1) interpolatedNormal: vec3f
      ) -> @location(0) vec4f {
        let n = normalize(interpolatedNormal);
        let towardLight = normalize(uniforms.light.xyz - worldPos);
        let towardEye = normalize(-worldPos);

        let kd = vec3f(0.72);
        let cosTheta = max(dot(n, towardLight), 0.0);
        let ambient = 0.2 * kd;
        let diffuse = 0.8 * kd * cosTheta;

        var specular = vec3f(0.0);
        if (cosTheta > 0.0) {
          let reflected = reflect(-towardLight, n);
          let cosPhi = max(dot(reflected, towardEye), 0.0);
          specular = vec3f(0.3 * pow(cosPhi, 32.0));
        }

        let visibility = lightVisibility(worldPos);
        return vec4f(ambient + visibility * (diffuse + specular), 1.0);
      }
    </script>
    <script id="depth-wgsl" type="x-shader">
      struct DepthUniforms {
        lightMvp: mat4x4f,
      };

      @group(0) @binding(0) var<uniform> depthUniforms: DepthUniforms;

      @vertex
      fn ground_depth_vs(@location(0) pos: vec3f) -> @builtin(position) vec4f {
        return depthUniforms.lightMvp * vec4f(pos, 1.0);
      }

      @vertex
      fn teapot_depth_vs(@location(0) pos: vec4f) -> @builtin(position) vec4f {
        return depthUniforms.lightMvp * pos;
      }

      @fragment
      fn depth_fs(@builtin(position) fragCoord: vec4f) -> @location(0) vec4f {
        return vec4f(vec3f(fragCoord.z), 1.0);
      }
    </script>
    <script id="shadow-common-wgsl" type="x-shader">
      struct ShadowSettings {
        lightViewProjection: mat4x4f,
        showMap: u32,
      };

      @group(1) @binding(0) var<uniform> shadowSettings: ShadowSettings;
      @group(1) @binding(1) var shadowMap: texture_2d<f32>;

      fn readShadowDepth(uv: vec2f) -> f32 {
        let size = vec2i(textureDimensions(shadowMap));
        let pixel = clamp(vec2i(uv * vec2f(size)), vec2i(0), size - vec2i(1));
        return textureLoad(shadowMap, pixel, 0).r;
      }

      fn lightVisibility(worldPos: vec3f) -> f32 {
        let clip = shadowSettings.lightViewProjection * vec4f(worldPos, 1.0);

        if (clip.w <= 0.0) {
          return 1.0;
        }

        let ndc = clip.xyz / clip.w;
        let uv = vec2f(0.5 * ndc.x + 0.5, 0.5 - 0.5 * ndc.y);

        if (any(uv < vec2f(0.0)) || any(uv > vec2f(1.0)) ||
            ndc.z < 0.0 || ndc.z > 1.0) {
          return 1.0;
        }

        let texelSize = 1.0 / vec2f(textureDimensions(shadowMap));
        let bias = 0.001;
        var litSamples = 0.0;

        for (var y = 0; y < 4; y++) {
          for (var x = 0; x < 4; x++) {
            let offset = vec2f(f32(x) - 1.5, f32(y) - 1.5);
            let sampleUV = uv + offset * texelSize;
            let nearestDepth = readShadowDepth(sampleUV);

            litSamples += select(1.0, 0.0, nearestDepth < ndc.z - bias);
          }
        }

        return litSamples / 16.0;
      }
    </script>
