    <script id="wgsl" type="x-shader">
      struct Uniforms {
        mvp: mat4x4f,
        eye: vec4f,
      };

      @group(0) @binding(0) var<uniform> uniforms: Uniforms;

      struct VSOut {
        @builtin(position) position: vec4f,
        @location(0) worldPos: vec3f,
        @location(1) normal: vec3f,
      };

      @vertex
      fn main_vs(
        @location(0) inPos: vec4f,
        @location(1) inNormal: vec4f
      ) -> VSOut {
        var vsOut: VSOut;
        vsOut.position = uniforms.mvp * inPos;
        vsOut.worldPos = inPos.xyz;
        vsOut.normal = inNormal.xyz;
        return vsOut;
      }

      @fragment
      fn main_fs(
        @location(0) worldPos: vec3f,
        @location(1) interpolatedNormal: vec3f
      ) -> @location(0) vec4f {
        let normal = normalize(interpolatedNormal);
        let towardLight = normalize(vec3f(-1.0, 1.0, 2.0));
        let towardEye = normalize(uniforms.eye.xyz - worldPos);

        let kd = vec3f(0.2, 0.5, 0.9);
        let ks = vec3f(0.6);
        let shininess = 32.0;

        let ambient = 0.15 * kd;

        let cosTheta = max(dot(normal, towardLight), 0.0);
        let diffuse = kd * cosTheta;

        var specular = vec3f(0.0);
        if (cosTheta > 0.0) {
          let reflected = reflect(-towardLight, normal);
          let cosPhi = max(dot(reflected, towardEye), 0.0);
          specular = ks * pow(cosPhi, shininess);
        }

        return vec4f(ambient + diffuse + specular, 1.0);
      }
    </script>
    <script type="text/javascript" src="myscript.js"></script>
