    <script id="wgsl" type="x-shader">
      struct Uniforms {
        mvp: mat4x4f,
      };

      @group(0) @binding(0) var<uniform> uniforms: Uniforms;
      @group(0) @binding(1) var cubeSampler: sampler;
      @group(0) @binding(2) var cubeMap: texture_cube<f32>;

      struct VSOut {
        @builtin(position) position: vec4f,
        @location(0) normal: vec3f,
      };

      @vertex
      fn main_vs(@location(0) inPos: vec3f) -> VSOut {
        var vsOut: VSOut;
        vsOut.position = uniforms.mvp * vec4f(inPos, 1.0);
        vsOut.normal = normalize(inPos);
        return vsOut;
      }

      @fragment
      fn main_fs(@location(0) interpolatedNormal: vec3f) -> @location(0) vec4f {
        let direction = normalize(interpolatedNormal);
        return textureSample(cubeMap, cubeSampler, direction);
      }
    </script>
