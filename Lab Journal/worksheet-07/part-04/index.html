<!doctype html>
<html>
  <head>
    <title>Worksheet 7 - Part 4</title>
    <script type="text/javascript" src="../../resources/MV.js"></script>
    <script type="text/javascript" src="../../resources/genmipmap.js"></script>
    <script id="wgsl" type="x-shader">
      struct Uniforms {
        mvp: mat4x4f,
        mtex: mat4x4f,
        eye: vec4f,
        reflective: u32,
      };

      @group(0) @binding(0) var<uniform> uniforms: Uniforms;
      @group(0) @binding(1) var cubeSampler: sampler;
      @group(0) @binding(2) var cubeMap: texture_cube<f32>;

      @group(0) @binding(3) var normalSampler: sampler;
      @group(0) @binding(4) var normalMap: texture_2d<f32>;

      struct VSOut {
        @builtin(position) position: vec4f,
        @location(0) direction: vec3f,
        @location(1) worldPos: vec3f,
      };

      @vertex
      fn main_vs(@location(0) inPos: vec3f) -> VSOut {
        var vsOut: VSOut;
        let p = vec4f(inPos, 1.0);

        vsOut.position = uniforms.mvp * p;
        vsOut.direction = (uniforms.mtex * p).xyz;
        vsOut.worldPos = inPos;

        return vsOut;
      }

      fn rotate_to_normal(n: vec3f, v: vec3f) -> vec3f {
        let sgn_nz = sign(n.z + 1.0e-16);
        let a = -1.0 / (1.0 + abs(n.z));
        let b = n.x * n.y * a;

        return vec3f(1.0 + n.x * n.x * a, b, -sgn_nz * n.x) * v.x
             + vec3f(sgn_nz * b, sgn_nz * (1.0 + n.y * n.y * a), -n.y) * v.y
             + n * v.z;
      }

      @fragment
      fn main_fs(
        @location(0) direction: vec3f,
        @location(1) worldPos: vec3f
      ) -> @location(0) vec4f {
        const PI = 3.14159265;

        var lookupDirection = normalize(direction);

        if (uniforms.reflective == 1u) {
          let n = normalize(direction);

          var phi = 0.0;
          if (n.x != 0.0 || n.z != 0.0) {
            phi = atan2(n.z, n.x);
          }

          let u = 0.5 - phi / (2.0 * PI);
          let v = acos(clamp(n.y, -1.0, 1.0)) / PI;
          let uv = vec2f(u, v);

          let encodedNormal = textureSampleLevel(normalMap, normalSampler, uv, 0.0).rgb;
          let tangentNormal = normalize(2.0 * encodedNormal - vec3f(1.0));

          let bumpedNormal = normalize(rotate_to_normal(n, tangentNormal));
          let incident = normalize(worldPos - uniforms.eye.xyz);

          lookupDirection = reflect(incident, bumpedNormal);
        }

        return textureSample(cubeMap, cubeSampler, lookupDirection);
      }
    </script>
    <script type="text/javascript" src="myscript.js"></script>
  </head>
  <body>
    <canvas id="my-canvas" width="512" height="512">
      Please use a browser that supports HTML5 canvas.
    </canvas>
    <div>
      <button id="decreaseButton" type="button" disabled>-</button>
      <span id="levelLabel">Niveau 0</span>
      <button id="increaseButton" type="button">+</button>
      <button id="orbitButton" type="button">Start kamerarotation</button>
    </div>
  </body>
</html>
