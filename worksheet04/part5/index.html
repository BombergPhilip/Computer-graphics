<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Worksheet 4 - Part 5</title>
  </head>

  <body>
    <button id="decrease">-</button>
    <button id="increase">+</button>
    <canvas id="canvas" width="512" height="512"></canvas>
  
    <label>
    kd
    <input id="kd" type="range" min="0" max="1" step="0.01" value="0.8">
    </label>

    <label>
    ks
    <input id="ks" type="range" min="0" max="1" step="0.01" value="0.5">
    </label>

    <label>
    Shininess
    <input id="shininess" type="range" min="1" max="100" step="1" value="20">
    </label>

    <label>
    Le
    <input id="Le" type="range" min="0" max="2" step="0.01" value="1">
    </label>

    <label>
    La
     <input id="La" type="range" min="0" max="1" step="0.01" value="0.2">
    </label>
    <script src="main.js"></script>
  </body>
</html>
